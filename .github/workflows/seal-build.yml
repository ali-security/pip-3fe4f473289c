# Build-and-pack only: pip 9.0.3's test suite runs on Travis (.travis.yml).
name: seal-build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - name: Install release-era build backend
        # The published wheel records `Generator: bdist_wheel (0.30.0)`;
        # setuptools 39.0.1 is the release-date setuptools.
        run: python -m pip install --index-url https://:2018-03-22@time-machines-pypi.sealsecurity.io/ setuptools==39.0.1 wheel==0.30.0
      - name: Build sdist and wheel
        run: python setup.py sdist bdist_wheel
      - run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
